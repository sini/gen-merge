name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A negative test runs on a scratch branch with no pull request: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

jobs:
  # The three-evaluator matrix (upstream Nix, Determinate, Lix) from gen-harness. The ref is the
  # gen-harness rev locked in ci/flake.lock, so one harness identity governs the run; `relock`
  # rewrites it when that lock moves.
  evaluators:
    uses: sini/gen-harness/.github/workflows/evaluators.yml@18adccc93926577e30ea4a9bd98ad33cedf17824

  # den-hoag-06toi: the bar registers never lower the bar silently. A HISTORY property (each revision of a
  # register against its predecessor), so it reads git and jq, never an evaluator, and runs once beside the
  # matrix rather than in each column, where its output was byte-identical (den-hoag-qbs25). It unshallows
  # the depth-1 checkout itself.
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/modules-sh-ratchet.sh
